
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux / GCC / All backends
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            libcglm-dev \
            libgl-dev \
            libvulkan-dev \
            libglfw3-dev \
            glslang-tools \
            libx11-dev

      - name: Configure
        run: |
          meson setup build \
            -Dbackends=all \
            -Dexamples=true \
            --buildtype=debugoptimized

      - name: Build library and examples
        run: meson compile -C build

      - name: Verify pkg-config installation
        run: |
          meson install -C build --destdir "$RUNNER_TEMP/runara-install"
          test -f "$RUNNER_TEMP/runara-install/usr/local/lib/x86_64-linux-gnu/pkgconfig/runara.pc" || \
          find "$RUNNER_TEMP/runara-install" -name 'runara.pc' -print

