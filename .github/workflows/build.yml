name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux / GCC / All backends
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libcglm-dev \
            libgl-dev \
            libvulkan-dev \
            libglfw3-dev

      - name: Configure
        run: |
          meson setup build \
            -Dbackends=all \
            -Dexamples=true \
            --buildtype=debugoptimized

      - name: Build library and examples
        run: meson compile -C build
